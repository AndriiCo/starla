[workspace]
resolver = "2"
members = [
    "crates/starla-common",
    "crates/starla-network",
    "crates/starla-measurements",
    "crates/starla-scheduler",
    "crates/starla-controller",
    "crates/starla-results",
    "crates/starla-metrics",
    "binaries/starla-probe",
    "binaries/starla-tray",
    "tests/mock-controller",
]
exclude = ["fuzz"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Starla Contributors"]
repository = "https://github.com/ananthb/starla"

[workspace.dependencies]
# Intra-workspace crates. Versions are required for `cargo publish` to
# rewrite path deps; bump these alongside [workspace.package].version.
starla-common       = { path = "crates/starla-common",       version = "1.0.0" }
starla-network      = { path = "crates/starla-network",      version = "1.0.0" }
starla-measurements = { path = "crates/starla-measurements", version = "1.0.0" }
starla-scheduler    = { path = "crates/starla-scheduler",    version = "1.0.0" }
starla-controller   = { path = "crates/starla-controller",   version = "1.0.0" }
starla-results      = { path = "crates/starla-results",      version = "1.0.0" }
starla-metrics      = { path = "crates/starla-metrics",      version = "1.0.0" }

# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
toml = "1.1"

# Networking
socket2 = { version = "0.6", features = ["all"] }
pnet_packet = "0.35"

# DNS
hickory-resolver = "0.26"
hickory-proto = "0.26"

# TLS/SSL
rustls = { version = "0.23" }
tokio-rustls = "0.26"

# SSH (Pure Rust)
russh = "0.65"

# System
caps = "0.5"
libc = "0.2"

# Observability - Metrics (feature-gated)
prometheus = { version = "0.14" }
axum = { version = "0.8" }

# Observability - Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Utilities
bytes = "1.7"
rand = "0.10"
base64 = "0.23"
hex = "0.4"
sha2 = "0.11"

# Testing
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
